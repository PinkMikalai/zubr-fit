

services:

  # ── MySQL ──
  db:
    image: mysql:8.0
    container_name: zubr_fit_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ZubrCoach
      MYSQL_USER: zubr_fit
      MYSQL_PASSWORD: zubr_fit
    ports:
      - "3306:3306"
    volumes:
      - zubr_fit_db_data:/var/lib/mysql

  # ── Symfony ──
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zubr_fit_backend
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
      - zubr_fit_backend_var:/var/www/html/var
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DATABASE_URL: "mysql://zubr_fit:zubr_fit@db:3306/ZubrCoach"

  # ── React ──
  frontend:
    image: node:20
    container_name: zubr_fit_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - zubr_fit_frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      VITE_API_URL: "http://localhost:8000"
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

  # ── phpMyAdmin ──
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: zubr_fit_phpmyadmin
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_USER: zubr_fit
      PMA_PASSWORD: zubr_fit
    depends_on:
      - db

volumes:
  zubr_fit_db_data:
  zubr_fit_frontend_node_modules:
  zubr_fit_backend_var: